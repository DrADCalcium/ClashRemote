name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [windows-port]
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Test and publish
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ClashRemote-win-x64
          path: windows/artifacts/ClashRemote-win-x64.zip
